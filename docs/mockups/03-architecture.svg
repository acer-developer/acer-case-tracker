<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7f8fb0"/></marker></defs>
<rect width="1400" height="620" fill="#0b1122"/>
<text x="40.0" y="50.0" font-size="20" fill="#fff" text-anchor="start" font-weight="700" >Architecture — 3D is just a view layer on the existing case data</text>
<rect x="40" y="100" width="280" height="200" rx="12" fill="#111a30" stroke="#5b8def" stroke-width="1.6"/><rect x="40" y="100" width="280" height="34" rx="12" fill="#5b8def" opacity=".2"/><text x="56.0" y="123.0" font-size="14" fill="#fff" text-anchor="start" font-weight="700" >Source of truth</text><text x="56.0" y="160.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Zoho CRM / Creator</text><text x="56.0" y="182.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >  · Mandates (Deals)</text><text x="56.0" y="204.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >  · Stage, analyst, dates</text><text x="56.0" y="226.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >  · Fees (Zoho Books)</text><text x="56.0" y="248.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Blueprint transitions</text>
<rect x="40" y="340" width="280" height="180" rx="12" fill="#111a30" stroke="#7a6cf0" stroke-width="1.6"/><rect x="40" y="340" width="280" height="34" rx="12" fill="#7a6cf0" opacity=".2"/><text x="56.0" y="363.0" font-size="14" fill="#fff" text-anchor="start" font-weight="700" >Events</text><text x="56.0" y="400.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Zoho webhooks on</text><text x="56.0" y="422.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >stage / owner change</text><text x="56.0" y="444.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >+ 5-min sync fallback</text><text x="56.0" y="466.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >(COQL delta query)</text>
<rect x="400" y="180" width="300" height="260" rx="12" fill="#111a30" stroke="#2fb4c9" stroke-width="1.6"/><rect x="400" y="180" width="300" height="34" rx="12" fill="#2fb4c9" opacity=".2"/><text x="416.0" y="203.0" font-size="14" fill="#fff" text-anchor="start" font-weight="700" >Case API (Node / FastAPI)</text><text x="416.0" y="240.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Normalised Case model</text><text x="416.0" y="262.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >SLA engine (SEBI TAT rules)</text><text x="416.0" y="284.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Aggregates per stage/office</text><text x="416.0" y="306.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >WebSocket push to clients</text><text x="416.0" y="328.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Role-based access (SSO)</text><text x="416.0" y="350.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Audit log, read-only first</text>
<rect x="780" y="100" width="280" height="200" rx="12" fill="#111a30" stroke="#c86df0" stroke-width="1.6"/><rect x="780" y="100" width="280" height="34" rx="12" fill="#c86df0" opacity=".2"/><text x="796.0" y="123.0" font-size="14" fill="#fff" text-anchor="start" font-weight="700" >Client state</text><text x="796.0" y="160.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >React + Zustand store</text><text x="796.0" y="182.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >TanStack Query cache</text><text x="796.0" y="204.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Same data feeds:</text><text x="796.0" y="226.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >  · 2D table view</text><text x="796.0" y="248.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >  · 3D floor view</text>
<rect x="780" y="340" width="280" height="200" rx="12" fill="#111a30" stroke="#f08a4b" stroke-width="1.6"/><rect x="780" y="340" width="280" height="34" rx="12" fill="#f08a4b" opacity=".2"/><text x="796.0" y="363.0" font-size="14" fill="#fff" text-anchor="start" font-weight="700" >3D layer</text><text x="796.0" y="400.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >React Three Fiber + drei</text><text x="796.0" y="422.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Instanced crates (1k+ cases)</text><text x="796.0" y="444.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Click → detail panel</text><text x="796.0" y="466.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Camera presets per office</text><text x="796.0" y="488.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Low-power 2D fallback</text>
<rect x="1120" y="220" width="240" height="200" rx="12" fill="#111a30" stroke="#3ecf8e" stroke-width="1.6"/><rect x="1120" y="220" width="240" height="34" rx="12" fill="#3ecf8e" opacity=".2"/><text x="1136.0" y="243.0" font-size="14" fill="#fff" text-anchor="start" font-weight="700" >Users</text><text x="1136.0" y="280.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Analysts</text><text x="1136.0" y="302.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Rating committee</text><text x="1136.0" y="324.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Ops / compliance head</text><text x="1136.0" y="346.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >Big-screen wall mode</text><text x="1136.0" y="368.0" font-size="12.5" fill="#cfd8ea" text-anchor="start" font-weight="400" >in the office</text>
